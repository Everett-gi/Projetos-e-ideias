# CI do PwnCheck: lint, formatação, testes e scans de segurança.
# Fica na raiz porque o GitHub só lê workflows em /.github/workflows (ver docsage-ci.yml).
name: PwnCheck CI

on:
  push:
    branches: [ main ]
    paths:
      - "python/pwncheck/**"
      - ".github/workflows/pwncheck-ci.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "python/pwncheck/**"
      - ".github/workflows/pwncheck-ci.yml"

# Menor privilégio: o token do workflow só pode LER o repositório.
permissions:
  contents: read

defaults:
  run:
    working-directory: python/pwncheck

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pwncheck/requirements*.txt

      - name: Instalar dependências (execução + desenvolvimento)
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Formatação (ruff format)
        run: ruff format --check .

      - name: Testes (pytest)
        run: pytest -q

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Configurar Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar ferramentas de segurança
        run: pip install pip-audit bandit

      # Aqui os scans BLOQUEIAM o CI (diferente do DocSage): o projeto é pequeno e
      # novo, então uma vulnerabilidade nova numa dependência deve ser tratada na hora.
      - name: Scan de vulnerabilidades nas dependências (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Análise estática de segurança (bandit)
        run: bandit -r app -ll
